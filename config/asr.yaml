# RealtimeSD ASR 转写配置（python -m asr.app 的全部调参项来源；逐项说明见本目录 README.md）
# 分段音频的导出开关在 config.yaml（separation_enabled），本文件只管转写。

# ---- 输入 ----
sample_rate: 16000

# ---- 推理 ----
device: auto
model: FunAudioLLM/Fun-ASR-Nano-2512

# ---- 长段滑窗续写 ----
prev_text_max_tokens: 0
max_segment_duration: 30.0
window_overlap: 10.0
