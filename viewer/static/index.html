<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>RealtimeSD · 管线产物时间线</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="topbar">
      <select id="sessionSelect" hidden></select>
      <span id="fileMode">
        <label class="file-label"
          >选择音频…<input type="file" id="audioFile" accept="audio/*" hidden
        /></label>
        <label class="file-label"
          >选择 transcript.jsonl / refined.rttm…<input
            type="file"
            id="transcriptFile"
            accept=".jsonl,.rttm"
            hidden
        /></label>
      </span>
      <audio id="player" controls></audio>
      <audio id="segPlayer" hidden></audio>
      <button id="fitBtn" title="重置缩放">适配全段</button>
      <span id="liveBadge" hidden>● LIVE</span>
      <label
        id="uncertainToggleWrap"
        hidden
        title="开启后，样本计数不足 post_merge_min_count 的说话人显示为 uncertain"
      >
        <input type="checkbox" id="uncertainToggle" checked /> uncertain 标记
      </label>
      <span id="speakers"></span>
    </div>
    <div id="stage">
      <canvas id="timeline"></canvas>
      <div id="status">加载中…</div>
    </div>
    <div id="transcript"></div>
    <div id="tooltip"></div>

    <script src="app.js"></script>
  </body>
</html>
