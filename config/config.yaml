# RealtimeSD diarization 管线配置（管线调参项的唯一来源；逐项说明见本目录 README.md）

# ---- 运行环境 ----
device: auto
hf_cache_dir: ./pretrained/huggingface

# ---- extract 阶段：模型 ----
model_type: eres2netv2
model_path:
segmentation_model: pyannote/segmentation-3.0

# ---- extract 阶段：chunk 调度 ----
chunk_duration: 10.0
hop_duration: 5.0

# ---- extract 阶段：local track 构造与 embedding 提取 ----
min_local_activity_duration: 0.30
min_segment_duration_for_embedding: 0.30
max_segment_duration_for_embedding: 4.0
segment_batch_size: 4

# ---- cluster 阶段：后端选择与通用 ----
clustering_backend: streaming

# ---- cluster 阶段：streaming 后端 ----
max_speakers: 50
new_speaker_threshold: 0.50
global_match_threshold: 0.50
min_segment_duration_for_new_speaker: 1.00
min_segment_duration_for_centroid_update: 1.50
merge_threshold: 0.90

# ---- cluster 阶段：ahc 后端（离线层次聚类） ----
ahc_similarity_threshold: 0.40
ahc_linkage: average

# ---- cluster 阶段：fastdiar 后端（仅 clustering_backend: fastdiar 时生效） ----
# 指派阈值（对应 fastdiar 的 clust_th）：observation 与最近质心相似度 ≥ 此值判 matched，否则尝试开新簇
fastdiar_assign_threshold: 0.45
# anchor 置信阈值（对应 fastdiar 的 confidence）：matched 且相似度 ≥ 此值才作为 anchor 更新质心
fastdiar_confidence_threshold: 0.65
# 连通分量并簇阈值（对应 fastdiar 的 merge_th）：新建 speaker 后，质心相似度 > 此值的连通分量整组并簇
fastdiar_merge_threshold: 0.80

# ---- cluster 阶段：后处理 ----
post_merge_min_count: 8
post_merge_min_similarity: 0.0

# ---- 分段音频导出（separation 独立离线工具使用；不在管线内） ----
separation_model: JusperLee/TIGER-speech
# 离线工具的帧扫描步长（秒）
separation_frame_step: 0.05
separation_energy_ratio: 0.05
separation_min_match_similarity: 0.10
max_segment_duration: 20.0

# ---- RTTM 输出 ----
min_segment_duration: 0.30
segment_merge_gap: 0.25
show_rttm: false

# ---- 调试 ----
debug: false
