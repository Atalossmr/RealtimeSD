# RealtimeSD 管线配置文件
# 全部调参项以本文件为唯一来源；CLI 仅保留运行时输入、模型/环境参数与少量开关
# 架构：segmentation-3.0 在 10s chunk 内做局部识别，ERes2NetV2 + 增量聚类做全局对齐

# ------------------------------------------------------------
# 模型与运行环境
# ------------------------------------------------------------
# 推理设备：auto / cpu / cuda / cuda:0
device: cuda
# 说话人 embedding 模型类型（当前仅支持 eres2netv2）
model_type: eres2netv2
# 本地 embedding checkpoint 路径；为空时自动走 ModelScope 默认模型
model_path:
# pyannote segmentation 模型名
segmentation_model: pyannote/segmentation-3.0
# Hugging Face 缓存目录
hf_cache_dir: ./pretrained/huggingface

# ------------------------------------------------------------
# chunk 调度
# ------------------------------------------------------------
# chunk 时长（秒）；segmentation-3.0 原生窗口即 10s
chunk_duration: 10.0
# 窗口推进步长（秒）。hop < chunk_duration 时为重叠滑窗：
# 每个窗口只提交中段 hop 秒（两侧各留 (chunk-hop)/2 作为边界缓冲），
# hop == chunk_duration 时退化为非重叠模式
hop_duration: 5.0

# ------------------------------------------------------------
# chunk 内 local track 构造与 embedding 提取
# ------------------------------------------------------------
# local slot 在 chunk 内的最小累计活跃时长（秒），低于则不建 track、不输出
min_local_activity_duration: 0.30
# 允许提取 embedding 的最短拼接时长（秒）
# ! 过低（< 0.105s@16k）可能产生 NaN embedding，导致 Hungarian 报错
min_segment_duration_for_embedding: 0.30
# 单个 track 用于提 embedding 的最大拼接时长（秒）
max_segment_duration_for_embedding: 4.0
# 批量提取 segment embedding 时的 batch size
segment_batch_size: 8

# ------------------------------------------------------------
# 全局 speaker 匹配与 centroid 维护
# ------------------------------------------------------------
# 最多维护多少个全局 speaker
max_speakers: 50
# 低于该相似度时，更倾向于新建 speaker
# 注意：probationary 架构下 false split 可被 absorb 修复、false glue 永久存在，
# 因此该阈值应靠近 global_match_threshold，宁可多建簇也不要黏合
new_speaker_threshold: 0.50
# observation 命中已有 global speaker 的主阈值
global_match_threshold: 0.50
# probationary speaker 被最近 confirmed speaker 吸收的相似度阈值
absorb_threshold: 0.65
# 仅当 track 时长达到该阈值，才允许新建 speaker（秒）
min_segment_duration_for_new_speaker: 0.50
# 仅当 track 时长达到该阈值，才允许更新 centroid（秒）
min_segment_duration_for_centroid_update: 1.50
# 新建 speaker 累计匹配语音达到该时长后转正（秒）
probation_confirm_duration: 10.0

# ------------------------------------------------------------
# RTTM 输出
# ------------------------------------------------------------
# RTTM 写出最短片段时长（秒）
min_segment_duration: 0.30
# 同 speaker 相邻片段自动拼接允许的最大间隔（秒，跨 chunk 生效）
streaming_merge_gap: 0.25
# 是否同步把新增 RTTM 行打印到控制台
show_rttm: false

# ------------------------------------------------------------
# 调试
# ------------------------------------------------------------
debug: false
